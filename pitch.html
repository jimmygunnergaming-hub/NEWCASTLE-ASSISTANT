<!DOCTYPE html>
<html>
<head>
  <title>Tactical Field Live Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://jsdelivr.net" rel="stylesheet">
  <style>
    body { background: #111; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; overflow-x: hidden; padding: 20px; user-select: none; }
    .top-controls { margin: 10px auto; max-width: 900px; display: flex; justify-content: space-between; align-items: center; background: #222; padding: 15px 25px; border-radius: 8px; border: 1px solid #333; }
    .pitch-container-wrapper { width: 100%; max-width: 900px; margin: 0 auto; position: relative; }
    .pitch-environment { 
      position: relative; width: 100%; height: 1150px;
      background: #27ae60;
      background-image: linear-gradient(rgba(255,255,255,0.06) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.06) 2px, transparent 2px);
      background-size: 100% 10%;
      border: 6px solid #fff; border-radius: 12px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6); overflow: hidden;
    }
    .midfield-line { position: absolute; top: 50%; left: 0; width: 100%; height: 6px; background: #fff; transform: translateY(-50%); }
    .center-circle { position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; border: 6px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); }
    .penalty-box-top { position: absolute; top: 0; left: 50%; width: 400px; height: 180px; border: 6px solid #fff; transform: translateX(-50%); border-top: none; }
    .penalty-box-bot { position: absolute; bottom: 0; left: 50%; width: 400px; height: 180px; border: 6px solid #fff; transform: translateX(-50%); border-bottom: none; }
    
    .player-node { position: absolute; width: 140px; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; transform: translate(-50%, -40%); z-index: 10; }
    .drag-handle { width: 85px; height: 85px; background: rgba(0,0,0,0.75); border: 2px dashed #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; transition: background 0.2s, border-color 0.2s; }
    .drag-handle:hover { background: rgba(241, 196, 15, 0.4); border-color: #f1c40f; }
    .add-text { font-size: 10px; font-weight: bold; color: #fff; pointer-events: none; text-align: center; line-height: 1.2; }
    .player-node img { width: 85px; height: 85px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; pointer-events: none; box-shadow: 0 6px 12px rgba(0,0,0,0.4); }
    
    .label-container { width: 130px; font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.85); border-radius: 6px; padding: 4px; border: 1px solid #444; text-align: center; margin-top: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    .pos-name-text { color: #f1c40f; text-transform: uppercase; cursor: text; min-height: 18px; display: inline-block; width: 100%; }
    .pos-edit-input { width: 100%; background: #333; color: #f1c40f; border: 1px solid #f1c40f; border-radius: 3px; font-size: 11px; font-weight: bold; text-align: center; text-transform: uppercase; padding: 1px; outline: none; }
    .usr-name { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; margin-top: 1px; }
    
    .pad-controls { display: flex; flex-direction: column; align-items: center; background: rgba(20,20,20,0.9); border: 1px solid #555; border-radius: 6px; padding: 3px; margin-top: 4px; gap: 2px; width: 80px; box-shadow: 0 3px 6px rgba(0,0,0,0.5); }
    .pad-row { display: flex; justify-content: center; gap: 4px; width: 100%; }
    .btn-pad { width: 22px; height: 22px; padding: 0; font-size: 11px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: bold; line-height: 1; }
    
    .modal-content { background: #1c1c1c; color: #fff; border: 2px solid #2ecc71; border-radius: 12px; }
    .member-card { background: #2c3e50; border-radius: 8px; cursor: pointer; transition: 0.2s; padding: 10px; border: 1px solid #34495e; display: flex; align-items: center; gap: 10px; text-align: left; }
    .member-card img { width: 35px; height: 35px; border-radius: 50%; }
    .member-card:hover { background: #2ecc71; color: #000; transform: translateY(-2px); font-weight: bold; border-color: #fff; }
    #lockout-screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.92); z-index: 10000; align-items: center; justify-content: center; flex-direction: column; }
  </style>
</head>
<body>

  <div id="lockout-screen">
    <h1 style="color: #e74c3c; font-weight: bold; margin-bottom: 15px;">🔒 Unauthorized Access Lockout</h1>
    <p style="font-size: 18px; max-width: 600px; text-align: center; color: #ccc;">This live tactical workspace dashboard can only be modified by the team coach who triggered the lineup generation command.</p>
  </div>

  <div class="top-controls">
    <h4 style="margin:0; color:#2ecc71; font-weight:bold; letter-spacing: 0.5px;">🏟️ NEWCASTLE TEAM MANAGER CONSOLE</h4>
    <button id="finish-btn" class="btn btn-success btn-md px-4 shadow font-weight-bold" onclick="saveAndPostToDiscord()">Finish Lineup & Send Image 🚀</button>
  </div>
  
  <div class="pitch-container-wrapper">
    <div class="pitch-environment" id="pitch">
      <div class="midfield-line"></div>
      <div class="center-circle"></div>
      <div class="penalty-box-top"></div>
      <div class="penalty-box-bot"></div>
      <div id="nodes-container"></div>
    </div>
  </div>

  <div class="modal fade" id="pickerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-secondary"><h5 class="modal-title">Select Live Server Member</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div class="row g-2" id="memberListContainer"></div></div>
      </div>
    </div>
  </div>

  <script src="https://jsdelivr.net"></script>
  <script>
    let sessionData = { roster: [], serverMembers: [], creatorId: "" };
    let activeEditIdx = null;
    let pickerModal;
    let currentUserId = "";

    const sessionId = window.location.pathname.split('/').pop();
    const urlParams = new URLSearchParams(window.location.search);
    currentUserId = urlParams.get('uid') || "";

    fetch('/api/session/' + sessionId)
      .then(res => res.json())
      .then(data => {
        sessionData = data;
        if (currentUserId !== sessionData.creatorId) {
          document.getElementById('lockout-screen').style.display = 'flex';
          return;
        }
        renderNodes();
      });

    document.addEventListener("DOMContentLoaded", () => {
      pickerModal = new bootstrap.Modal(document.getElementById('pickerModal'));
    });

    function renderNodes() {
      const container = document.getElementById('nodes-container');
      container.innerHTML = '';
      
      sessionData.roster.forEach((player, idx) => {
        const node = document.createElement('div');
        node.className = 'player-node';
        node.id = 'node_' + idx;
        node.style.left = player.pctX + '%';
        node.style.top = player.pctY + '%';

        let innerGraphic = `<div class="drag-handle" id="handle_${idx}" onclick="openRosterPicker(${idx})"><span class="add-text">➕ ADD<br>PLAYER</span></div>`;
        if (player.avatar && player.avatar !== '') {
          innerGraphic = `<img src="${player.avatar}" id="handle_${idx}" onclick="openRosterPicker(${idx})">`;
        }

        node.innerHTML = `
          ${innerGraphic}
          <div class="label-container">
            <div class="pos-element" id="pos_container_${idx}">
              <span class="pos-name-text" id="pos_text_${idx}" onclick="enableInlineTextEditing(${idx})">${player.role}</span>
            </div>
            <div class="usr-name" onclick="openRosterPicker(${idx})">${player.name}</div>
          </div>
          <div class="pad-controls">
            <div class="pad-row"><button class="btn btn-secondary btn-pad" onclick="nudgeNode(${idx}, 0, -2)">▲</button></div>
            <div class="pad-row">
              <button class="btn btn-secondary btn-pad" onclick="nudgeNode(${idx}, -1.5, 0)">◀</button>
              <button class="btn btn-secondary btn-pad" onclick="nudgeNode(${idx}, 1.5, 0)">▶</button>
            </div>
            <div class="pad-row"><button class="btn btn-secondary btn-pad" onclick="nudgeNode(${idx}, 0, 2)">▼</button></div>
          </div>
        `;

        container.appendChild(node);
        setupDragLogic(node, idx);
      });
    }

    function setupDragLogic(el, idx) {
      const handle = document.getElementById('handle_' + idx);
      let isDragging = false;

      handle.addEventListener('mousedown', startDrag);
      handle.addEventListener('touchstart', startDrag, { passive: false });

      function startDrag(e) {
        if (e.target.tagName === 'BUTTON' || e.target.classList.contains('pos-name-text')) return;
        e.preventDefault();
        isDragging = true;
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('touchend', stopDrag);
      }

      function dragMove(e) {
        if (!isDragging) return;
        const pitch = document.getElementById('pitch').getBoundingClientRect();
        const clientX = e.touches ? e.touches.clientX : e.clientX;
        const clientY = e.touches ? e.touches.clientY : e.clientY;

        let x = ((clientX - pitch.left) / pitch.width) * 100;
