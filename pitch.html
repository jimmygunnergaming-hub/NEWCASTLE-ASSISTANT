<!DOCTYPE html>
<html>
<head>
  <title>Tactical Field Live Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://jsdelivr.net" rel="stylesheet">
  <style>
    body { background: #111; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; overflow-x: hidden; padding: 10px; user-select: none; }
    .top-controls { margin: 10px auto; max-width: 850px; display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px 20px; border-radius: 8px; border: 1px solid #333; }
    .pitch-container-wrapper { width: 100%; max-width: 850px; margin: 0 auto; position: relative; }
    .pitch-environment { 
      position: relative; width: 100%; height: 85vh;
      background: #27ae60;
      background-image: linear-gradient(rgba(255,255,255,0.1) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.1) 2px, transparent 2px);
      background-size: 100% 10%;
      border: 5px solid #fff; border-radius: 12px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6); overflow: hidden;
    }
    .midfield-line { position: absolute; top: 50%; left: 0; width: 100%; height: 5px; background: #fff; }
    .center-circle { position: absolute; top: 50%; left: 50%; width: 160px; height: 160px; border: 5px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); }
    .penalty-box-top { position: absolute; top: 0; left: 50%; width: 320px; height: 140px; border: 5px solid #fff; transform: translateX(-50%); border-top: none; }
    .penalty-box-bot { position: absolute; bottom: 0; left: 50%; width: 320px; height: 140px; border: 5px solid #fff; transform: translateX(-50%); border-bottom: none; }
    .player-node { position: absolute; width: 85px; height: 85px; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: translate(-50%, -50%); z-index: 10; }
    .drag-handle { width: 75px; height: 75px; background: rgba(0,0,0,0.6); border: 2px dashed #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: move; transition: background 0.2s; }
    .drag-handle:hover { background: rgba(241, 196, 15, 0.4); border-color: #f1c40f; }
    .add-text { font-size: 10px; font-weight: bold; color: #fff; pointer-events: none; text-align: center; }
    .player-node img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; pointer-events: none; box-shadow: 0 6px 12px rgba(0,0,0,0.4); }
    .label-container { position: absolute; bottom: -45px; width: 120px; font-size: 11px; font-weight: bold; background: rgba(0,0,0,0.85); border-radius: 4px; padding: 2px; border: 1px solid #444; cursor: pointer; text-align: center; }
    .pos-name { color: #f1c40f; text-transform: uppercase; pointer-events: none; } 
    .usr-name { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .modal-content { background: #1c1c1c; color: #fff; border: 2px solid #2ecc71; border-radius: 12px; }
    .member-card { background: #2c3e50; border-radius: 8px; cursor: pointer; transition: 0.2s; padding: 10px; margin-bottom: 5px; border: 1px solid #34495e; }
    .member-card:hover { background: #2ecc71; color: #000; transform: translateY(-2px); font-weight: bold; border-color: #fff; }
  </style>
  <script src="https://cloudflare.com"></script>
</head>
<body>

  <div class="top-controls">
    <h4 style="margin:0; color:#2ecc71; font-weight:bold;">🏟️ NEWCASTLE LINEUP WORKSPACE</h4>
    <button class="btn btn-success btn-md px-4 shadow font-weight-bold" onclick="saveAndPostToDiscord()">Finish Lineup & Send Image 🚀</button>
  </div>
  
  <div class="pitch-container-wrapper">
    <div class="pitch-environment" id="pitch">
      <div class="midfield-line"></div>
      <div class="center-circle"></div>
      <div class="penalty-box-top"></div>
      <div class="penalty-box-bot"></div>
      <div id="nodes-container"></div>
    </div>
  </div>

  <div class="modal fade" id="positionModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-color: #f1c40f;">
        <div class="modal-header border-secondary"><h5 class="modal-title">Set Position Name</h5></div>
        <div class="modal-body text-start">
          <label class="form-label text-muted">What position is this slot? (e.g. GK, CB, Striker, LW)</label>
          <input type="text" class="form-control bg-dark text-white border-secondary" id="posNameInput" placeholder="Striker">
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-warning w-100" font-weight-bold" onclick="submitPositionName()">Next: Choose Player ➡️</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="pickerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header border-secondary"><h5 class="modal-title">Select Live Server Member</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div class="row g-2" id="memberListContainer"></div></div>
      </div>
    </div>
  </div>

  <script src="https://jsdelivr.net"></script>
  <script>
    let sessionData = {};
    let activeEditIdx = null;
    let posModal, pickerModal;

    const sessionId = window.location.pathname.split('/').pop();
    fetch('/api/session/' + sessionId)
      .then(res => res.json())
      .then(data => {
        sessionData = data;
        renderNodes();
      });

    document.addEventListener("DOMContentLoaded", () => {
      posModal = new bootstrap.Modal(document.getElementById('positionModal'));
      pickerModal = new bootstrap.Modal(document.getElementById('pickerModal'));
    });

    function renderNodes() {
      const container = document.getElementById('nodes-container');
      container.innerHTML = '';
      
      sessionData.roster.forEach((player, idx) => {
        let pctX = 50;
        let pctY = 75 - (idx * 15);

        if (idx === 0) { pctX = 50; pctY = 90; } 
        else if (idx === 1) { pctX = 25; pctY = 70; }
        else if (idx === 2) { pctX = 75; pctY = 70; }
        else if (idx === 3) { pctX = 50; pctY = 65; }
        else if (idx === 4) { pctX = 20; pctY = 45; }
        else if (idx === 5) { pctX = 80; pctY = 45; }
        else if (idx === 6) { pctX = 50; pctY = 40; }
        else if (idx === 7) { pctX = 35; pctY = 25; }
        else if (idx === 8) { pctX = 65; pctY = 25; }
        else if (idx === 9) { pctX = 20; pctY = 15; }
        else if (idx === 10) { pctX = 80; pctY = 15; }

        const node = document.createElement('div');
        node.className = 'player-node';
        node.id = 'node_' + idx;
        node.style.left = pctX + '%';
        node.style.top = pctY + '%';

        const handle = document.createElement('div');
        handle.className = 'drag-handle';
        handle.id = 'handle_' + idx;
        handle.innerHTML = '<span class="add-text">➕ ADD<br>PLAYER</span>';
        
        handle.addEventListener('mousedown', (e) => startNodeDrag(e, idx));
        handle.addEventListener('click', (e) => {
          if (!node.classList.contains('dragging')) {
            handleNodeClick(idx);
          }
        });

        const labelContainer = document.createElement('div');
        labelContainer.className = 'label-container';
        labelContainer.innerHTML = '<div class="pos-name" id="lbl_pos_' + idx + '">' + player.posLabel + '</div>' +
                                    '<div class="usr-name" id="lbl_usr_' + idx + '">Unassigned</div>';
        
        labelContainer.addEventListener('click', (e) => {
          e.stopPropagation();
          handleNodeClick(idx);
        });

        node.appendChild(handle);
        node.appendChild(labelContainer);
        container.appendChild(node);
      });
    }

    function startNodeDrag(e, idx) {
      const node = document.getElementById('node_' + idx);
      const pitch = document.getElementById('pitch');
      
      function onMouseMove(event) {
        node.classList.add('dragging');
        const rect = pitch.getBoundingClientRect();
        let x = ((event.clientX - rect.left) / rect.width) * 100;
        let y = ((event.clientY - rect.top) / rect.height) * 100;
        if(x >= 5 && x <= 95) node.style.left = x + '%';
        if(y >= 5 && y <= 95) node.style.top = y + '%';
      }
      
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', () => {
        document.removeEventListener('mousemove', onMouseMove);
        setTimeout(() => node.classList.remove('dragging'), 50);
      }, {once: true});
    }

    function handleNodeClick(idx) {
      activeEditIdx = idx;
      document.getElementById('posNameInput').value = sessionData.roster[idx].posLabel;
      posModal.show();
    }

    function submitPositionName() {
      const inputVal = document.getElementById('posNameInput').value.trim();
      const finalPosName = inputVal || "POS #" + (activeEditIdx + 1);
      
      sessionData.roster[activeEditIdx].posLabel = finalPosName;
      document.getElementById('lbl_pos_' + activeEditIdx).innerText = finalPosName;
      
      posModal.hide();
      openPlayerPicker();
    }

    function openPlayerPicker() {
      const container = document.getElementById('memberListContainer');
      container.innerHTML = '';
      
      sessionData.serverMembers.forEach(m => {
        const div = document.createElement('div');
        div.className = 'col-12 member-card d-flex align-items-center gap-3';
