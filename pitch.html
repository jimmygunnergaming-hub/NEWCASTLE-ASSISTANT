<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Lineup</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #07130c;
    color: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#app {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    background: rgba(5, 15, 9, 0.94);
    border-bottom: 1px solid rgba(255,255,255,0.12);

    z-index: 100;
}

.title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.subtitle {
    margin-top: 3px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
}

.top-buttons {
    display: flex;
    gap: 10px;
}

button {
    border: 0;
    cursor: pointer;
    font-family: inherit;
}

.top-button {
    min-width: 110px;
    height: 40px;

    padding: 0 16px;

    border-radius: 8px;

    color: white;
    background: rgba(255,255,255,0.08);

    font-size: 13px;
    font-weight: 700;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

.top-button:hover {
    background: rgba(255,255,255,0.15);
    transform: translateY(-1px);
}

.top-button.finish {
    background: #15803d;
}

.top-button.finish:hover {
    background: #16a34a;
}

/* =========================
   PITCH AREA
========================= */

.pitch-wrapper {
    position: absolute;

    left: 50%;
    top: calc(50% + 30px);

    transform: translate(-50%, -50%);

    width: min(92vw, 1100px);
    height: min(78vh, 720px);

    display: flex;
    align-items: center;
    justify-content: center;
}

.pitch {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    border-radius: 12px;

    background:
        repeating-linear-gradient(
            to bottom,
            #20753d 0px,
            #20753d 70px,
            #1d6d39 70px,
            #1d6d39 140px
        );

    border: 3px solid rgba(255,255,255,0.8);

    box-shadow:
        0 20px 70px rgba(0,0,0,0.45),
        inset 0 0 40px rgba(0,0,0,0.12);
}

/* pitch lines */

.line {
    position: absolute;
    pointer-events: none;
    border-color: rgba(255,255,255,0.85);
}

.halfway {
    left: 0;
    top: 50%;
    width: 100%;
    height: 0;
    border-top: 3px solid rgba(255,255,255,0.85);
}

.center-circle {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 150px;
    height: 150px;

    transform: translate(-50%, -50%);

    border: 3px solid rgba(255,255,255,0.85);
    border-radius: 50%;
}

.center-dot {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 8px;
    height: 8px;

    transform: translate(-50%, -50%);

    background: white;
    border-radius: 50%;
}

/* penalty boxes */

.penalty-box {
    position: absolute;

    left: 50%;

    width: 34%;
    height: 17%;

    transform: translateX(-50%);

    border-left: 3px solid white;
    border-right: 3px solid white;
}

.penalty-top {
    top: 0;

    border-bottom: 3px solid white;
}

.penalty-bottom {
    bottom: 0;

    border-top: 3px solid white;
}

/* six yard boxes */

.six-box {
    position: absolute;

    left: 50%;

    width: 16%;
    height: 7%;

    transform: translateX(-50%);

    border-left: 3px solid white;
    border-right: 3px solid white;
}

.six-top {
    top: 0;
    border-bottom: 3px solid white;
}

.six-bottom {
    bottom: 0;
    border-top: 3px solid white;
}

/* goals */

.goal {
    position: absolute;

    left: 50%;

    width: 16%;
    height: 3.5%;

    transform: translateX(-50%);

    border: 3px solid white;

    background: rgba(255,255,255,0.08);
}

.goal-top {
    top: -3.5%;
}

.goal-bottom {
    bottom: -3.5%;
}

/* =========================
   PLAYERS
========================= */

.player {
    position: absolute;

    width: 78px;
    height: 78px;

    transform: translate(-50%, -50%);

    z-index: 20;

    user-select: none;
    touch-action: none;

    cursor: grab;
}

.player:active {
    cursor: grabbing;
}

.player-card {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.avatar {
    width: 52px;
    height: 52px;

    border-radius: 50%;

    object-fit: cover;

    background: #111827;

    border: 3px solid white;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.35);
}

.avatar-placeholder {
    width: 52px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #111827;

    border: 3px solid white;

    font-size: 18px;
    font-weight: 900;
}

.player-name {
    max-width: 100px;

    margin-top: 5px;

    padding: 3px 7px;

    border-radius: 5px;

    background: rgba(0,0,0,0.75);

    font-size: 11px;
    font-weight: 800;

    text-align: center;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-role {
    margin-top: 2px;

    font-size: 9px;
    font-weight: 700;

    color: rgba(255,255,255,0.8);
}

/* =========================
   SIDE PANEL
========================= */

.side-panel {
    position: absolute;

    right: 18px;
    top: 88px;

    width: 250px;
    max-height: calc(100vh - 110px);

    padding: 16px;

    overflow-y: auto;

    background: rgba(7,16,10,0.95);

    border:
        1px solid rgba(255,255,255,0.12);

    border-radius: 12px;

    z-index: 90;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.35);
}

.panel-title {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 12px;
}

.player-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.member {
    display: flex;
    align-items: center;

    width: 100%;

    padding: 8px;

    border-radius: 8px;

    background: rgba(255,255,255,0.05);

    cursor: pointer;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

.member:hover {
    background: rgba(255,255,255,0.12);
    transform: translateX(-2px);
}

.member-avatar {
    width: 32px;
    height: 32px;

    border-radius: 50%;

    object-fit: cover;

    margin-right: 9px;
}

.member-name {
    flex: 1;

    min-width: 0;

    font-size: 12px;
    font-weight: 700;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

/* =========================
   BOTTOM INFO
========================= */

.bottom-info {
    position: absolute;

    left: 20px;
    bottom: 18px;

    padding: 10px 14px;

    background: rgba(0,0,0,0.65);

    border-radius: 8px;

    z-index: 80;

    font-size: 11px;

    color: rgba(255,255,255,0.7);
}

.bottom-info strong {
    color: white;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.7);

    z-index: 500;
}

.modal {
    width: min(420px, 90vw);

    padding: 24px;

    border-radius: 14px;

    background: #101813;

    border: 1px solid rgba(255,255,255,0.12);

    box-shadow: 0 25px 80px rgba(0,0,0,0.55);
}

.modal h2 {
    margin-bottom: 10px;

    font-size: 20px;
}

.modal p {
    color: rgba(255,255,255,0.65);

    line-height: 1.5;

    font-size: 13px;
}

.modal-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 20px;
}

.modal-button {
    padding: 10px 16px;

    border-radius: 7px;

    color: white;

    background: rgba(255,255,255,0.08);

    font-weight: 700;
}

.modal-button.confirm {
    background: #15803d;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .side-panel {
        width: 210px;
    }

    .pitch-wrapper {
        width: 86vw;
        height: 70vh;
        left: 45%;
    }

    .player {
        width: 65px;
        height: 65px;
    }

    .avatar,
    .avatar-placeholder {
        width: 44px;
        height: 44px;
    }
}

@media (max-width: 650px) {

    .topbar {
        height: 58px;
        padding: 0 10px;
    }

    .title {
        font-size: 17px;
    }

    .subtitle {
        display: none;
    }

    .top-button {
        min-width: auto;
        height: 34px;
        padding: 0 10px;
        font-size: 11px;
    }

    .pitch-wrapper {
        top: calc(50% + 20px);
        left: 50%;
        width: 94vw;
        height: 67vh;
    }

    .side-panel {
        display: none;
    }

    .center-circle {
        width: 90px;
        height: 90px;
    }

    .player {
        width: 58px;
        height: 58px;
    }

    .avatar,
    .avatar-placeholder {
        width: 38px;
        height: 38px;
        border-width: 2px;
    }

    .player-name {
        font-size: 9px;
        padding: 2px 4px;
    }

    .player-role {
        font-size: 7px;
    }

    .bottom-info {
        display: none;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="topbar">

        <div>
            <div class="title">
                Football Lineup
            </div>

            <div class="subtitle">
                Drag players to position them
            </div>
        </div>

        <div class="top-buttons">

            <button
                class="top-button"
                id="resetButton">
                Reset
            </button>

            <button
                class="top-button finish"
                id="finishButton">
                Finish Lineup
            </button>

        </div>

    </div>

    <div class="pitch-wrapper">

        <div
            class="pitch"
            id="pitch">

            <div class="line halfway"></div>

            <div class="center-circle"></div>

            <div class="center-dot"></div>

            <div
                class="penalty-box penalty-top">
            </div>

            <div
                class="penalty-box penalty-bottom">
            </div>

            <div
                class="six-box six-top">
            </div>

            <div
                class="six-box six-bottom">
            </div>

            <div
                class="goal goal-top">
            </div>

            <div
                class="goal goal-bottom">
            </div>

            <div id="players"></div>

        </div>

    </div>

    <div class="side-panel">

        <div class="panel-title">
            Server Players
        </div>

        <div
            class="player-list"
            id="memberList">
        </div>

    </div>

    <div class="bottom-info">
        <strong>Tip:</strong>
        Drag players around the pitch to arrange your lineup.
    </div>

</div>

<div
    class="modal-overlay"
    id="modalOverlay">

    <div class="modal">

        <h2 id="modalTitle">
            Confirm
        </h2>

        <p id="modalText">
            Are you sure?
        </p>

        <div class="modal-buttons">

            <button
                class="modal-button"
                id="cancelModal">
                Cancel
            </button>

            <button
                class="modal-button confirm"
                id="confirmModal">
                Confirm
            </button>

        </div>

    </div>

</div>

<script>
"use strict";

/* =========================
   SESSION
========================= */

const pathParts =
    window.location.pathname.split("/");

const sessionId =
    decodeURIComponent(
        pathParts[pathParts.length - 1] || ""
    );

const params =
    new URLSearchParams(
        window.location.search
    );

const userId =
    params.get("uid") || "";

const pitch =
    document.getElementById("pitch");

const playersContainer =
    document.getElementById("players");

const memberList =
    document.getElementById("memberList");

let session = null;
let draggedPlayer = null;

/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}

/* =========================
   LOAD SESSION
========================= */

async function loadSession() {

    if (!sessionId) {

        showError(
            "No lineup session was supplied."
        );

        return;
    }

    try {

        const response =
            await fetch(
                `/api/session/${encodeURIComponent(sessionId)}`
            );

        if (!response.ok) {
            throw new Error(
                "Session could not be loaded."
            );
        }

        session =
            await response.json();

        render();

    } catch (error) {

        console.error(error);

        showError(
            "This lineup could not be loaded. It may have expired."
        );
    }
}

function showError(message) {

    playersContainer.innerHTML = `
        <div style="
            position:absolute;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:30px;
            font-size:18px;
            font-weight:700;
        ">
            ${escapeHTML(message)}
        </div>
    `;
}

/* =========================
   RENDER
========================= */

function render() {

    playersContainer.innerHTML = "";

    renderPlayers();

    renderMembers();
}

function renderPlayers() {

    if (!session || !Array.isArray(session.roster)) {
        return;
    }

    session.roster.forEach(
        (player, index) => {

            const element =
                document.createElement("div");

            element.className = "player";

            element.dataset.index =
                String(index);

            element.style.left =
                `${player.pctX ?? 50}%`;

            element.style.top =
                `${player.pctY ?? 50}%`;

            const avatar =
                player.avatar
                    ? `
                        <img
                            class="avatar"
                            src="${escapeHTML(player.avatar)}"
                            alt=""
                            draggable="false"
                        >
                      `
                    : `
                        <div class="avatar-placeholder">
                            ${index + 1}
                        </div>
                      `;

            element.innerHTML = `
                <div class="player-card">
                    ${avatar}

                    <div class="player-name">
                        ${escapeHTML(
                            player.name ||
                            "Unassigned"
                        )}
                    </div>

                    <div class="player-role">
                        ${escapeHTML(
                            player.role ||
                            ""
                        )}
                    </div>
                </div>
            `;

            addDragEvents(element);

            playersContainer.appendChild(
                element
            );
        }
    );
}

function renderMembers() {

    memberList.innerHTML = "";

    if (
        !session ||
        !Array.isArray(session.serverMembers)
    ) {
        return;
    }

    session.serverMembers.forEach(
        member => {

            const element =
                document.createElement("div");

            element.className = "member";

            element.innerHTML = `
                <img
                    class="member-avatar"
                    src="${escapeHTML(member.avatar || "")}"
                    alt=""
                >

                <div class="member-name">
                    ${escapeHTML(
                        member.name ||
                        member.username ||
                        "Player"
                    )}
                </div>
            `;

            element.addEventListener(
                "click",
                () => assignMember(member)
            );

            memberList.appendChild(element);
        }
    );
}

/* =========================
   DRAGGING
========================= */

function addDragEvents(element) {

    element.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            draggedPlayer = {
                element,
                index:
                    Number(
                        element.dataset.index
                    )
            };

            element.setPointerCapture(
                event.pointerId
            );

            element.style.zIndex = "100";
        }
    );

    element.addEventListener(
        "pointermove",
        event => {

            if (
                !draggedPlayer ||
                draggedPlayer.element !== element
            ) {
                return;
            }

            const rect =
                pitch.getBoundingClientRect();

            const x =
                ((event.clientX - rect.left) /
                    rect.width) *
                100;

            const y =
                ((event.clientY - rect.top) /
                    rect.height) *
                100;

            const px =
                clamp(x, 4, 96);

            const py =
                clamp(y, 4, 96);

            element.style.left =
                `${px}%`;

            element.style.top =
                `${py}%`;

            if (session.roster[
                draggedPlayer.index
            ]) {

                session.roster[
                    draggedPlayer.index
                ].pctX = px;

                session.roster[
                    draggedPlayer.index
                ].pctY = py;
            }
        }
    );

    element.addEventListener(
        "pointerup",
        async event => {

            if (!draggedPlayer) {
                return;
            }

            element.releasePointerCapture(
                event.pointerId
            );

            element.style.zIndex = "20";

            draggedPlayer = null;

            await saveSession();
        }
    );

    element.addEventListener(
        "pointercancel",
        () => {

            if (!draggedPlayer) {
                return;
            }

            element.style.zIndex = "20";

            draggedPlayer = null;
        }
    );
}

/* =========================
   ASSIGN PLAYER
========================= */

async function assignMember(member) {

    if (!session) {
        return;
    }

    let index =
        session.currentIndex || 0;

    if (
        !session.roster[index]
    ) {
        index = 0;
    }

    session.roster[index].name =
        member.name ||
        member.username ||
        "Player";

    session.roster[index].avatar =
        member.avatar || "";

    session.currentIndex =
        Math.min(
            index + 1,
            session.roster.length - 1
        );

    renderPlayers();

    await saveSession();
}

/* =========================
   SAVE
========================= */

let saveTimer = null;

function saveSession() {

    clearTimeout(saveTimer);

    return new Promise(resolve => {

        saveTimer =
            setTimeout(
                async () => {

                    try {

                        const response =
                            await fetch(
                                `/api/session/${encodeURIComponent(sessionId)}`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            uid: userId,
                                            roster:
                                                session.roster
                                        })
                                }
                            );

                        if (!response.ok) {

                            console.warn(
                                "Failed to save lineup."
                            );
                        }

                    } catch (error) {

                        console.error(
                            "Save error:",
                            error
                        );
                    }

                    resolve();

                },
                150
            );
    });
}

/* =========================
   RESET
========================= */

document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        async () => {

            if (!session) {
                return;
            }

            session.roster.forEach(
                (player, index) => {

                    player.name =
                        "Unassigned";

                    player.avatar = "";

                    player.pctX = 50;

                    player.pctY =
                        index === 0
                            ? 90
                            : 75;
                }
            );

            session.currentIndex = 0;

            render();

            await saveSession();
        }
    );

/* =========================
   FINISH
========================= */

document
    .getElementById("finishButton")
    .addEventListener(
        "click",
        () => {

            openModal(
                "Finish Lineup",
                "Are you sure you want to finish this lineup?",
                finishLineup
            );
        }
    );

/* =========================
   MODAL
========================= */

const modalOverlay =
    document.getElementById(
        "modalOverlay"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const modalText =
    document.getElementById(
        "modalText"
    );

const cancelModal =
    document.getElementById(
        "cancelModal"
    );

const confirmModal =
    document.getElementById(
        "confirmModal"
    );

let modalAction = null;

function openModal(
    title,
    text,
    action
) {

    modalTitle.textContent =
        title;

    modalText.textContent =
        text;

    modalAction =
        action;

    modalOverlay.style.display =
        "flex";
}

function closeModal() {

    modalOverlay.style.display =
        "none";

    modalAction = null;
}

cancelModal.addEventListener(
    "click",
    closeModal
);

confirmModal.addEventListener(
    "click",
    async () => {

        const action =
            modalAction;

        closeModal();

        if (action) {
            await action();
        }
    }
);

/* =========================
   FINISH REQUEST
========================= */

async function finishLineup() {

    if (!session) {
        return;
    }

    try {

        await saveSession();

        const response =
            await fetch(
                `/api/session/${encodeURIComponent(sessionId)}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            uid: userId,
                            action: "finish",
                            roster:
                                session.roster
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.error ||
                "Could not finish lineup."
            );

            return;
        }

        alert(
            "Lineup finished successfully!"
        );

    } catch (error) {

        console.error(error);

        alert(
            "There was a problem finishing the lineup."
        );
    }
}

/* =========================
   START
========================= */

loadSession();
</script>

</body>
</html>
